<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>متجر محول الإشعارات والرسائل</title>
  <style>
    :root{color-scheme:light dark;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}
    body{margin:0;background:#f4f6f8;color:#17202a}.wrap{max-width:780px;margin:auto;padding:32px 18px}
    .hero,.card{background:#fff;border:1px solid #e5e8eb;border-radius:24px;padding:24px;box-shadow:0 12px 35px #0000000d}
    .hero{background:linear-gradient(135deg,#ecf5ff,#fff)}h1{margin:0 0 8px;font-size:2rem}.muted{color:#637083}
    .badge{display:inline-block;background:#e8f5e9;color:#176a2e;border-radius:999px;padding:6px 12px;font-weight:700}
    .btn{display:inline-block;text-decoration:none;background:#1264a3;color:#fff;padding:13px 18px;border-radius:14px;font-weight:800;margin-top:14px}
    .btn.secondary{background:#eef3f7;color:#234}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:16px}
    .card{border-radius:18px;padding:18px}code{direction:ltr;unicode-bidi:embed;font-size:.85em;word-break:break-all}.notes li{margin:7px 0}
    footer{text-align:center;color:#778;margin-top:24px;font-size:.9em}@media(prefers-color-scheme:dark){body{background:#101418;color:#eef}.hero,.card{background:#181e24;border-color:#29313a}.hero{background:linear-gradient(135deg,#182a38,#181e24)}.muted{color:#aab5c0}.btn.secondary{background:#29313a;color:#eef}}
  </style>
</head>
<body><main class="wrap">
  <section class="hero">
    <span class="badge">المتجر الرسمي</span>
    <h1>محول الإشعارات والرسائل</h1>
    <p class="muted">تنزيل الإصدار الرسمي الموثق. التطبيق نفسه يتحقق من الإصدار والحجم وبصمة SHA-256 قبل التثبيت.</p>
    <div id="status">جارٍ قراءة أحدث إصدار…</div>
    <a id="download" class="btn" href="#" hidden>تنزيل أحدث APK</a>
    <a class="btn secondary" href="privacy.html">سياسة الخصوصية</a>
  </section>
  <section class="grid" id="details"></section>
  <section class="card notes" style="margin-top:16px"><h2>ما الجديد</h2><ul id="notes"><li>جارٍ التحميل…</li></ul></section>
  <footer>التوزيع الرسمي فقط — لا يحتوي هذا المستودع على كود المصدر الخاص.</footer>
</main>
<script>
(async()=>{try{const r=await fetch('latest.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const x=await r.json();
status.innerHTML=`<strong>الإصدار ${x.versionName}</strong> — Build ${x.versionCode}`;download.href=x.downloadUrl;download.hidden=false;
details.innerHTML=`<div class="card"><b>الحجم</b><p>${(x.sizeBytes/1048576).toFixed(2)} MB</p></div><div class="card"><b>تاريخ النشر</b><p>${new Date(x.publishedAt).toLocaleString('ar')}</p></div><div class="card"><b>SHA-256</b><p><code>${x.sha256}</code></p></div>`;
notes.innerHTML=(x.releaseNotes||[]).map(n=>`<li>${String(n).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}</li>`).join('')||'<li>تحسينات عامة.</li>';
}catch(e){status.textContent='تعذر قراءة أحدث إصدار الآن. استخدم صفحة Releases كمسار بديل.';notes.innerHTML='<li>خدمة المتجر غير متاحة مؤقتًا.</li>';}})();
</script></body></html>
