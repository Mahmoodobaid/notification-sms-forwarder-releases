<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta name="robots" content="noindex,nofollow">
  <title>تنزيل أحدث إصدار — محول الإشعارات والرسائل</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#071c3a;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}
    main{max-width:620px;padding:32px;text-align:center}
    .dot{width:44px;height:44px;margin:0 auto 18px;border:5px solid #ffffff33;border-top-color:#20e3b2;border-radius:50%;animation:s 1s linear infinite}
    @keyframes s{to{transform:rotate(360deg)}}
    a{display:inline-block;margin-top:18px;padding:14px 22px;border-radius:14px;background:#20e3b2;color:#06213d;text-decoration:none;font-weight:800}
    p{line-height:1.8;color:#dcecf7}
  </style>
</head>
<body>
<main>
  <div class="dot" aria-hidden="true"></div>
  <h1>جارٍ فتح أحدث إصدار…</h1>
  <p>سيتم تحويلك تلقائيًا إلى ملف APK الرسمي الأحدث.</p>
  <a id="manual" href="https://github.com/Mahmoodobaid/notification-sms-forwarder-releases/releases/latest">إذا لم يبدأ التنزيل، اضغط هنا</a>
</main>
<script>
(async()=>{
  const fallback='https://github.com/Mahmoodobaid/notification-sms-forwarder-releases/releases/latest';
  const manual=document.getElementById('manual');
  try{
    const r=await fetch('../latest.json?ts='+Date.now(),{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const x=await r.json();
    const prefix='https://github.com/Mahmoodobaid/notification-sms-forwarder-releases/releases/download/';
    if(x.packageName!=='com.mahmoodobaid.notificationforwarder' || typeof x.downloadUrl!=='string' || !x.downloadUrl.startsWith(prefix)) throw new Error('Invalid update manifest');
    manual.href=x.downloadUrl;
    manual.textContent='تنزيل أحدث إصدار الآن';
    window.location.replace(x.downloadUrl);
  }catch(e){
    manual.href=fallback;
    document.querySelector('h1').textContent='تعذر بدء التنزيل تلقائيًا';
    document.querySelector('p').textContent='اضغط الزر لفتح صفحة أحدث إصدار.';
  }
})();
</script>
</body>
</html>
